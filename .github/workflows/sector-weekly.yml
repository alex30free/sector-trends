name: Update sector trends

on:
  schedule:
    # Every weekday (Friday included) a little before 19:00 Swedish time, after the 17:30 close.
    # GitHub's clock is UTC: 17:53 UTC = 18:53 Swedish winter time (CET), 19:53 summer time (CEST).
    # Not on the hour on purpose: GitHub skips scheduled runs more often at :00 when it is busy.
    - cron: "53 17 * * 1-5"
    # Back-up run later the same evening, in case GitHub skips the first one.
    # If the first run already saved today's prices, this run changes nothing.
    - cron: "37 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sector-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download prices and rebuild sector indices
        run: python scripts/sector_update.py

      - name: Commit updated data
        run: |
          git add data.json daily_omxspi.json 2>/dev/null || git add data.json
          if git diff --cached --quiet; then
            echo "No changes in data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git commit -m "sector trends: data update $(date -u +%Y-%m-%d)"
          git push
